name: CI 并部署到 Sealos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sealos-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: kanshan-detective
  ALIYUN_CR_REGISTRY: crpi-4fx5gjh2gg6qrzgj.cn-beijing.personal.cr.aliyuncs.com
  ALIYUN_CR_NAMESPACE: sunnynh
  K8S_NAMESPACE: ns-z8o8d2sw
  K8S_STATEFULSET: kanshan-detective
  K8S_CONTAINER: kanshan-detective

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: 设置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建前端
        run: pnpm build

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装后端依赖
        run: python -m pip install -r requirements.txt

      - name: 校验后端与 SQLite 初始化
        env:
          KANSHAN_DATA_DIR: ${{ runner.temp }}/kanshan-ci-data
        run: |
          python -m compileall -q server
          python -c "from server.db import DB_PATH, get_case, init_db; init_db(); assert DB_PATH.is_file(); assert get_case()['caseId'] == 'case_001'"

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录阿里云容器镜像服务
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ALIYUN_CR_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: 构建并按需推送 Docker 镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          # 阿里云个人版 ACR 不支持 Buildx attestation 的 OCI artifact manifest。
          provenance: false
          sbom: false
          tags: |
            ${{ env.ALIYUN_CR_REGISTRY }}/${{ env.ALIYUN_CR_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.ALIYUN_CR_REGISTRY }}/${{ env.ALIYUN_CR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 安装 kubectl
        if: github.event_name != 'pull_request'
        uses: azure/setup-kubectl@v4

      - name: 设置 Sealos Kubernetes Context
        if: github.event_name != 'pull_request'
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: 更新 Sealos 工作负载镜像
        if: github.event_name != 'pull_request'
        env:
          IMAGE_URI: ${{ env.ALIYUN_CR_REGISTRY }}/${{ env.ALIYUN_CR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          kubectl get statefulset -n "${K8S_NAMESPACE}" "${K8S_STATEFULSET}"
          kubectl set image -n "${K8S_NAMESPACE}" \
            "statefulset/${K8S_STATEFULSET}" \
            "${K8S_CONTAINER}=${IMAGE_URI}"

      - name: 等待 Sealos 部署完成
        if: github.event_name != 'pull_request'
        run: kubectl rollout status -n "${K8S_NAMESPACE}" "statefulset/${K8S_STATEFULSET}" --timeout=300s
